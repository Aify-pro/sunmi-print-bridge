apply plugin: 'com.android.application'

android {
    namespace 'com.kiosk.printbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.kiosk.printbridge"
        // 24 (Android 7.0) : les tablettes Sunmi V2 tournent sous Android 7.1.1
        // (API 25). Rien dans le code n'exige d'API plus récente.
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
